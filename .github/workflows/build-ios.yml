name: Build JUCE Plugin (iOS)

# The iOS builds live in their own workflow so the platform build is not waiting
# on them. They need a macOS runner, an Xcode toolchain and a simulator SDK that
# none of the VST3/CLAP/Standalone jobs touch, they are the longest jobs in the
# set, and a queued simulator runner used to hold the whole run's status. Split
# out, "did the plugin build" is answered by the build workflow, and "does it
# still build for iOS" by this one; each can be re-run without the other.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # The two iOS destinations are two jobs, not two rows of one matrix: they share
  # the same steps, so the steps are written once and anchored, but a queued
  # simulator runner no longer delays the device build's result and each one can
  # be re-run on its own. The check names are unchanged - they still say which
  # SDK built, because that is the only thing that differs.
  build-ios-device:
    name: build-ios (AUv3, iphoneos, arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_SDK: iphoneos

    steps: &ios-steps
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule missing - CMakeLists.txt adds it via add_subdirectory(JUCE)."
            echo "Run: git submodule update --init --recursive"
            exit 1
          fi
          ls JUCE/modules | head -n 5

      - name: Cache the CMake dependency trees
        uses: ./.github/actions/build-cache
        with:
          build-dir: build-ios-${{ env.IOS_SDK }}
          flavour: ios-${{ env.IOS_SDK }}
          deps-hash: ${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.gitmodules') }}

      - name: Configure CMake for ${{ env.IOS_SDK }}
        run: |
          cmake -S . -B "build-ios-${{ env.IOS_SDK }}" -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=${{ env.IOS_SDK }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DJ37_FAST_CI_BUILD=ON \
            -DJ37_RENDER_BACKEND=SOKOL \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build the AUv3 extension
        run: |
          #  One pass. The old shape built twice: the first piped into grep with its
          #  status dropped, the second into /dev/null only to learn the exit code.
          #  That was a second full walk of every target, and the failing output was
          #  unreachable anyway.
          status=0
          cmake --build "build-ios-${{ env.IOS_SDK }}" \
            --config "${{ env.BUILD_TYPE }}" \
            --target first_AUv3 \
            --parallel 2 \
            > "$RUNNER_TEMP/ios-build.log" 2>&1 || status=$?

          grep -E 'error|warning|Error|FAILED|BUILD' "$RUNNER_TEMP/ios-build.log" || true

          if [ "$status" -ne 0 ]; then
            echo "Build failed with exit code $status - full log follows:"
            cat "$RUNNER_TEMP/ios-build.log"
            exit "$status"
          fi

      - name: Verify the iOS AUv3 bundle
        run: |
          set -euo pipefail
          appex=$(find "build-ios-${{ env.IOS_SDK }}/first_artefacts/${{ env.BUILD_TYPE }}/AUv3" \
            -name "*.appex" -prune -print -quit)
          if [ -z "$appex" ]; then
            echo "No iOS AUv3 extension was produced for ${{ env.IOS_SDK }}."
            find "build-ios-${{ env.IOS_SDK }}/first_artefacts" -print 2>/dev/null || true
            exit 1
          fi

          executable=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$appex/Info.plist")
          binary="$appex/$executable"
          if [ ! -f "$binary" ]; then
            echo "AUv3 executable is missing: $binary"
            exit 1
          fi

          archs=$(lipo -archs "$binary")
          echo "$binary: $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *)
              echo "AUv3 bundle does not contain the requested arm64 slice."
              exit 1
              ;;
          esac

      - name: Upload iOS AUv3 artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiBoX-AUv3-${{ env.IOS_SDK }}-arm64
          path: build-ios-${{ env.IOS_SDK }}/first_artefacts/${{ env.BUILD_TYPE }}/AUv3/*.appex
          if-no-files-found: error

  build-ios-simulator:
    name: build-ios (AUv3, iphonesimulator, arm64)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_SDK: iphonesimulator

    steps: *ios-steps

