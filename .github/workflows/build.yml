name: Build JUCE VST3 Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup JUCE at expected absolute path
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "D:\Desktop\Programs"
        git clone https://github.com/juce-framework/JUCE.git "D:\Desktop\Programs\JUCE"
        Set-Location "D:\Desktop\Programs\JUCE"
        git checkout 8.0.10

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile VST3 via MSBuild
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if ($sln) {
            Write-Host "Found solution file: $($sln.FullName)"
            msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64
        } else {
            Write-Error "Solution file (.sln) not found in repository!"
            exit 1
        }

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: J37-TapeSaturator-VST3
        path: |
          Builds/**/*.vst3
        if-no-files-found: error