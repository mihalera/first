name: Build JUCE VST3 Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Locate Visual Studio MSBuild
      shell: powershell
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe was not found. Visual Studio is not installed on this runner."
        }

        $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
        if (-not $vsInstallPath) {
          throw "No Visual Studio installation with MSBuild was found."
        }

        $msbuild = Join-Path $vsInstallPath 'MSBuild\Current\Bin\MSBuild.exe'
        if (-not (Test-Path $msbuild)) {
          throw "MSBuild.exe was not found under $vsInstallPath"
        }

        "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $env:Path += ";$((Split-Path $msbuild -Parent))"
        Write-Host "Using MSBuild: $msbuild"

    - name: Prepare JUCE checkout and fix generated project paths
      shell: powershell
      run: |
        $repoRoot = $env:GITHUB_WORKSPACE
        $juceRoot = Join-Path $repoRoot 'JUCE'
        $legacyPaths = @(
          'D:\Desktop\Programs\JUCE',
          'D:\Programs\JUCE'
        )

        if (-not (Test-Path "$juceRoot\modules")) {
          git clone --depth 1 https://github.com/juce-framework/JUCE.git $juceRoot
        }

        foreach ($legacy in $legacyPaths) {
          $parent = Split-Path $legacy -Parent
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          if (Test-Path $legacy) {
            Remove-Item $legacy -Recurse -Force -ErrorAction SilentlyContinue
          }
          New-Item -ItemType Junction -Path $legacy -Target $juceRoot -Force | Out-Null
        }

        Get-ChildItem -Path $repoRoot -Recurse -Include *.vcxproj,*.props,*.targets | ForEach-Object {
          $path = $_.FullName
          $content = Get-Content $path -Raw
          $updated = $content
          foreach ($legacy in $legacyPaths) {
            $updated = $updated.Replace($legacy, $juceRoot)
          }
          if ($updated -ne $content) {
            Set-Content -Path $path -Value $updated -Encoding UTF8
            Write-Host "Patched JUCE path in: $path"
          }
        }

    - name: Compile VST3 via MSBuild
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if (-not $sln) {
          Write-Error "Файл рішення (.sln) не знайдено в репозиторії!"
          exit 1
        }

        $msbuild = $env:MSBUILD_PATH
        Write-Host "Знайдено проєкт: $($sln.FullName)"
        & $msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: J37-TapeSaturator-VST3
        path: |
          Builds/**/*.vst3
        if-no-files-found: error