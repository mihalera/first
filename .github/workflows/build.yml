name: Build JUCE Plugin (CMake)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug
  JUCE_BUILD_TESTS: "ON"
  J37_BUILD_HOTPATH_BENCH: "ON"

jobs:
  build-linux-debug:
    name: build-linux-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f JUCE/CMakeLists.txt ]; then
            echo "JUCE/CMakeLists.txt missing"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Intel IPP (PyPI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipp-static
          python - <<'PYIPP'
          import glob, os, site
          found = ""
          for base in site.getsitepackages():
              for up in range(1, 5):
                  p = os.path.normpath(os.path.join(base, *[".."] * up))
                  if glob.glob(os.path.join(p, "include", "ipp.h")):
                      found = p
                      break
              if found:
                  break
          print(found, end="")
          PYIPP
          if [ -z "$prefix" ]; then
            echo "IPP include prefix not found"
            exit 1
          fi
          echo "IPPROOT=$prefix" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DJ37_BUILD_TESTS=${{ env.JUCE_BUILD_TESTS }} \
            -DJ37_BUILD_HOTPATH_BENCH=${{ env.J37_BUILD_HOTPATH_BENCH }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2>&1 | \
            grep -E 'error:|warning:|Error:|FAILED|BUILD' || true
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel >/dev/null 2>&1 || {
            echo "Build failed - re-running with full output:"
            cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
            exit 1
          }

      - name: Verify VST3 bundle was produced
        id: vst3
        run: |
          set -euo pipefail
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}/VST3"
          bundle=$(find "$BASE" -maxdepth 1 -name "*.vst3" -print -quit 2>/dev/null || true)
          if [ -z "$bundle" ]; then
            echo "No .vst3 bundle found under $BASE"
            find build/first_artefacts -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          echo "Found bundle: $bundle"
          binary=$(find "$bundle" -name "*.so" -print -quit 2>/dev/null || true)
          if [ -z "$binary" ]; then
            echo "No .so binary found inside $bundle"
            find "$bundle" || true
            exit 1
          fi
          echo "Found binary: $binary"
          file "$binary"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload Linux VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonlinAnalogSaturator-VST3-Linux
          path: ${{ steps.vst3.outputs.bundle }}
          if-no-files-found: error

  dsp-benchmark:
    name: dsp-benchmark
    runs-on: ubuntu-latest
    needs: [build-linux-debug]
    if: github.event_name != 'pull_request' || github.event.pull_request.head_ref == 'freebuff/changes-pn8fpcs8'
    strategy:
      fail-fast: false
      matrix:
        BENCHMARK_SAMPLE_RATE: [44100, 96000, 192000]
        BENCHMARK_CHANNELS: [1, 2]
        BENCHMARK_NUM_SAMPLES: ["262144", "1048576"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f JUCE/CMakeLists.txt ]; then
            echo "JUCE/CMakeLists.txt missing"
            exit 1
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Install Intel IPP (PyPI)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ipp-static

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DJ37_BUILD_TESTS=${{ env.JUCE_BUILD_TESTS }} \
            -DJ37_BUILD_HOTPATH_BENCH=${{ env.J37_BUILD_HOTPATH_BENCH }}

      - name: Build dsp-benchmark
        run: |
          set -o pipefail
          bash scripts/bench_hotpath_target.sh build

      - name: Run dsp-benchmark
        id: run-bench
        run: |
          set -euo pipefail
          bash scripts/run_hotpath_bench.sh \
            --benchmark_min_time=0.5 \
            --benchmark_out=junit.xml \
            --benchmark_out_format=json

      - name: Upload dsp-benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-benchmark-results
          path: junit.xml
          if-no-files-found: error

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Android)
        run: |
          cmake -S . -B build-android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_API=29 \
            -DCMAKE_ANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
            -DANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a

      - name: Build Android Standalone
        run: |
          set -o pipefail
          cmake --build build-android --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify Android Standalone .so
        run: |
          set -euo pipefail
          so=$(find build-android -name "*.so" -print -quit)
          if [ -z "$so" ]; then
            echo "No .so produced"
            exit 1
          fi
          file "$so" | grep -q "aarch64" || {
            echo "The produced library is not aarch64"
            exit 1
          }
