name: Build JUCE VST3 Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Prepare JUCE folder layout expected by the generated project
      shell: powershell
      run: |
        $juceRoot = 'D:\Desktop\Programs\JUCE'
        $altRoot = 'D:\Programs\JUCE'

        New-Item -ItemType Directory -Path $juceRoot -Force | Out-Null

        if (-not (Test-Path "$altRoot")) {
          New-Item -ItemType SymbolicLink -Path $altRoot -Target $juceRoot -Force | Out-Null
        }

        if (-not (Test-Path "$juceRoot\modules")) {
          git clone --depth 1 https://github.com/juce-framework/JUCE.git $juceRoot
        }

    - name: Compile VST3 via MSBuild
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
        if (-not $sln) {
          Write-Error "Файл рішення (.sln) не знайдено в репозиторії!"
          exit 1
        }

        Write-Host "Знайдено проєкт: $($sln.FullName)"
        msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: J37-TapeSaturator-VST3
        path: |
          Builds/**/*.vst3
        if-no-files-found: error