name: Build JUCE Plugin (CMake)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

  # How many translation units the Linux jobs compile at once. Deliberately not
  # "as many as the runner has cores": the editor is one file per concern now
  # (see the Sources block in CMakeLists.txt) and every one of those files pulls
  # in <JuceHeader.h>, so several of the heaviest units in the project can be in
  # flight at the same moment. On ubuntu-latest an unbounded --parallel let their
  # peak add up past what the runner has, and the OOM killer took the compiler
  # out mid-build: the Release job died with "Killed signal terminated program
  # cc1plus" while building Source/GUI/TapeScene.cpp, and the Debug job lost the
  # runner agent itself (exit 143 with no compiler error anywhere above it).
  # Two in flight is what the runner holds.
  J37_BUILD_JOBS: 2

jobs:
  # ============================================================================
  #  DSP regression harness - the SUBFUND stage
  #
  #  Deliberately first and deliberately cheap. The subharmonic defects this
  #  guards - a series that does not fall off with division, a stage that turns
  #  its own partials into harmonics, a stage that keeps generating with no
  #  signal - are properties of the RENDERED AUDIO, not of the code as written.
  #  Nothing short of rendering them catches a regression, and the three
  #  platform builds below take far too long to be the place to find out.
  #
  #  The harness needs no JUCE, no audio backend and no host: it includes the
  #  shipping stages out of Source/ at build time and compiles them against a
  #  small shim, so it cannot end up measuring a stale copy of the code. The one
  #  step here that does look at JUCE is the last one, which compiles the moved
  #  Source/DSP/ headers against juce_audio_basics instead of that shim - a name
  #  the shim provides is not proof that real JUCE provides it, and the check is
  #  what keeps "harness green, plugin red" from being a fifteen-minute discovery
  #  in the platform builds. That is why the checkout below takes the submodule
  #  (measured at a few seconds, depth 1) while every other step ignores it.
  #
  #  The same script now also compiles the shaper's tanh seam in three shapes -
  #  J37_USE_SIMD_TANH with xsimd, the flag with the library absent, and neither
  #  (tests/dsp/simd_tanh_test.cpp) - and compares their curve digests across the
  #  binaries, because "the flag reaches the rendered audio" is a claim about two
  #  builds rather than about one. That switch is OFF in every build this
  #  repository ships, which is exactly why a branch nothing compiles has to be
  #  compiled here or it rots. No submodule is needed for it: xsimd is vendored
  #  under ThirdParty/.
  # ============================================================================
  dsp-tests:
    name: DSP regression harness
    runs-on: ubuntu-latest
    # 20, not 10: tests/neural compiles NeuralAmpModelerCore's sixteen Eigen
    # translation units for its fixture binaries, and the sanitizer step below
    # pays that again with ASan + UBSan instrumentation. That is roughly a minute
    # per shape on four cores, on top of every other harness and the Debug build.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run the subharmonic harness
        run: bash tests/dsp/run.sh

      # The knob strip's geometry is arithmetic, not rendering: the editor layout
      # becomes a grid, the grid becomes a column count and a tile, and the tile
      # becomes the disc the LookAndFeel is handed. This harness cuts those five
      # blocks out of Source/PluginEditor.cpp, compiles them against a stub of the
      # toolkit, and walks every page at four panel sizes - so a layout that puts
      # a 4 px disc on a seven-knob page (which is what the 780 x 664 floor did
      # before the strip was solved) fails here in seconds rather than in a
      # screenshot on someone else's display. Same shape as the DSP harness above:
      # no JUCE, no window, no submodules. The same run also reads the two ends of
      # the editor's constructor split - the phases the header declares and the
      # one call per phase in the constructor - because a phase that stops being
      # called still compiles and simply leaves its controls unbuilt.
      - name: Run the knob layout harness
        run: bash tests/layout/run.sh

      # The tooltip dwell, which is the panel's "hold on a control and the hint
      # appears" rule as arithmetic: j37panel::TipDwell in Source/GUI/TipDwell.h
      # keeps the clock that decides when a hint may be shown. It exists because
      # juce::TooltipWindow applies its delay only to the FIRST tip - while one is
      # on screen, moving to the next control shows that control's tip at once,
      # which is the reported flicker. The harness runs the rule at exact
      # millisecond boundaries, with no window and no JUCE.
      - name: Run the tooltip dwell harness
        run: bash tests/tooltip/run.sh

      # The parameter table and the saved-state round trip. A state a host saved
      # is a promise to the user: opening a project written by an older build has
      # to give back the sound it was saved with, and a block the host hands over
      # has to be refused rather than half-applied. Both live in the two functions
      # that write and read the state tree, and the MIX rescale from 0..1 to
      # 0..100 is exactly the change that fails silently - the state still loads,
      # it just loads as a different sound. So this cuts the shipping parameter
      # table and those functions out of Source/, compiles them against a stub of
      # the toolkit, and writes, reads and migrates states. Same shape as the two
      # harnesses above: no JUCE, no host, seconds of work.
      - name: Run the saved-state harness
        run: bash tests/state/run.sh

      # The transport - STOP / PLAY / START and the SPINDOWN hold. Both defects
      # this guards were GESTURES, and a gesture is not visible in the source: the
      # machine as written looked right, START did nothing on a machine that was
      # already running, and STOP approached rest asymptotically instead of
      # arriving, so a "stopped" machine was still passing a faded copy of its
      # input. This harness includes the shipping TransportRig and drives it
      # frame by frame, checking each key against the duration its own
      # note claims and the platter the engine actually follows - including the
      # one multiplication that makes STOP silence rather than lower. Same shape as
      # the harnesses above: no JUCE, no host, a few seconds.
      - name: Run the transport harness
        run: bash tests/transport/run.sh

      # The pitch stage - the autotune's detector and its shifter. Autotune was
      # reported as doing nothing, and both reasons were properties of the signal
      # rather than of the code as written: a detector that counted zero crossings
      # reads a guitar's second harmonic an octave high (so the correction landed
      # where the note already was) and reports a confident pitch for pure noise;
      # a shifter whose head is re-seated against a neighbour that has not moved yet
      # this frame creeps forward by a frame per grain, which is a few cents of
      # permanent detune and a grain-rate wobble on top. Neither is visible by
      # reading the source - one is a number on rendered audio, the other is an
      # ordering of two loops - so this harness includes both stages and measures
      # the reading and the splice on generated signal. Same shape as
      # the harnesses above: no JUCE, no host, a few seconds.
      #
      # It builds the file TWICE, and the second build is the point of this
      # comment: Source/DSP/CorrectorStage.h has two engines behind one interface,
      # and the second binary is compiled exactly as -DJ37_CORRECTOR_USE_STRETCH=ON
      # compiles the plugin. The numbers that keep that option OFF - 1216 frames of
      # reported lookahead, a transposition 56 cents wide at 0.94x against the
      # granular engine's sub-cent reading - are printed by that run rather than
      # quoted here, so the flag and its evidence cannot drift apart.
      - name: Run the pitch harness
        run: bash tests/pitch/run.sh

      # The output anti-phase guard. It sits at the end of the wet path and, for a
      # pair whose sides oppose, folds what opposes the mid back into the mid
      # instead of fading it out - so it is the one stage whose failure is INAUDIBLE
      # in stereo and total in mono. The guard splits the frame into three bands
      # and rotates only the bands whose own correlation is negative, which is the
      # difference from the frame-wide guard it replaces: the old one fixed a
      # cancelling low end by flattening every band. Neither claim is visible by
      # reading the source - both are numbers on rendered audio - so this includes
      # the shipping header and measures the crossover flat, the untouched healthy
      # frame, the side energy per band and the unwind after the fault ends.
      # Same shape as the harnesses above: no JUCE, no host, a few seconds.
      - name: Run the anti-phase guard harness
        run: bash tests/phase/run.sh

      # The AUTO GAIN compensator - the one gain stage in the chain that nothing
      # measured. It compares the finished signal against the reference taken after
      # the input trim and pays back what the tape stage and both compressors lost,
      # so a mix does not drift quieter with every edit. Three things it must never
      # do are numbers on rendered audio rather than on source: boost a programme
      # that is already loud, restore more than its 12 dB ceiling, or drive itself
      # to that ceiling because STOP made the output silent. This drives the
      # shipping header with generated signal and asserts each one, plus the 450 ms
      # time constant at two rates. Same shape as the harnesses above: no JUCE, no
      # host, a few seconds.
      - name: Run the auto gain compensator harness
        run: bash tests/gain/run.sh

      # The output safety limiter - the stage that keeps the soft clipper idle.
      # Nothing drove it before: the only other mention of it in tests/ was a
      # reduced replica inside the SUBFUND harness's signal path, which can only be
      # wrong in the same way as the code it copies. This includes the shipping
      # header and the block-rate coefficients that feed it, and asserts what the
      # two-stage protection design depends on: a programme below the ceiling comes
      # back bit for bit, a step 6 dB over it is caught within a few milliseconds
      # and held at the ceiling, the catch is fast and the release slow enough not
      # to pump between notes, and the shape is the same duration at every engine
      # rate. Same shape as the harnesses above: no JUCE, no host, a few seconds.
      - name: Run the safety limiter harness
        run: bash tests/limiter/run.sh

      # The MIX crossfade - the last of the four stages item 4 named. It is the one
      # control that decides how much of the finished tape signal leaves the plugin,
      # and the only thing that read it was a text check in the transport harness,
      # which can see that a gate is multiplied in but not that the crossfade is
      # smooth or that its ends are the two signals. This includes the shipping
      # header and renders signal through both legs: MIX 0 % is the dry input bit for
      # bit, 100 % is the tape path, an uncorrelated pair holds its level across the
      # travel while a correlated one is the +3 dB the equal-power law costs, and a
      # closed transport gate empties both legs - which is what makes STOP a stop at
      # MIX 0 % too. Same shape as the harnesses above: no JUCE, no host, seconds.
      - name: Run the MIX crossfade harness
        run: bash tests/mix_crossfader/run.sh

      # The neural stage's rate conversion. A .nam model carries the rate it was
      # TRAINED at and the engine runs at the session's rate times its oversampling
      # factor, and a network's memory is counted in samples rather than seconds -
      # so a model driven at the wrong rate is not a brighter version of itself but
      # a different network. Nothing about that shows up in a build or on the panel,
      # so the bridge is driven on generated signal at every rate pair the engine
      # can produce, and what is measured is the sequence the MODEL is handed.
      - name: Run the neural rate harness
        run: bash tests/neural/run.sh

      # The spectrum analyser. It is a MEASUREMENT - it reads the signal and writes
      # nothing to it, so a wrong reading is a wrong PICTURE and never a wrong sound,
      # and no stage depends on it. That is precisely why it is pinned rather than
      # eyeballed: a curve 12 dB high, or one that draws 6 kHz where 2 kHz belongs,
      # looks entirely plausible on a panel, and it is the user who already trusted it
      # who notices. Stated on rendered signal: a full-scale tone on a bin centre reads
      # 0 dBFS, the reading is linear, a tone between bins reads low only as far as a
      # Hann window's own 1.42 dB scalloping allows, a tone an octave up lands in a
      # higher band, and silence reads the floor.
      #
      # This ALSO compiles the same header a second time with ThirdParty/pocketfft off
      # the include path, which is the only place in this suite where the
      # ABSENT-library branch of a stage is built at all - and it is the pass that
      # gives pocketfft, on the link line since long before anything included it, its
      # first caller.
      - name: Run the spectrum harness
        run: bash tests/spectrum/run.sh

      # The room. It is the one stage in this suite that CALLS a third-party
      # library rather than reimplementing one: SPACE is Dattorro's plate, from
      # ThirdParty/dattorro-verb, and this harness compiles that library's own
      # verb.c as C beside the shipping header as C++ - which is also the only
      # place the stage's extern "C" wrapping is measured at all.
      #
      # What it asserts is a property no source reading and no listening test can
      # reach: Dattorro's tank is a set of delay lines whose lengths are SAMPLE
      # COUNTS, so a tail run at 96 kHz is half as long as the same setting at 48.
      # The wrapper runs the tank at the rate those lengths were chosen at and
      # carries the signal across, and the measure of whether that works is the
      # tail in SECONDS: 0.65 / 1.18 / 3.07 s for SIZE 0.1 / 0.5 / 0.9, and 1.21 /
      # 1.18 / 1.20 s for SIZE 0.5 at 44.1, 48 and 96 kHz. Alongside it: MIX 0 is
      # the frame back bit for bit (at every rate, not just the tank's), the two
      # sides of the tail are decorrelated so the width is real, a mono bus gets
      # the pair summed rather than one side, MIX 1 lands within 6 dB of the dry
      # programme, and the tail decays away without a NaN or an infinity.
      - name: Run the room harness
        run: bash tests/reverb/run.sh

      # The factory presets cannot fail at runtime - a name list that is a row
      # short, or a parameter with no column in the table, both just quietly
      # load the wrong sound - so they are checked against the source instead.
      # It found the real defect this job was added for: fifteen sound-bearing
      # parameters (the input preamp, the DI chain, the extra distortion stage,
      # the second head's four controls and the output stage's two switches)
      # were declared as parameters and had no column at all, so every preset
      # loaded "mostly" and the same preset gave different results depending on
      # what was loaded before it.
      - name: Check the factory preset table
        run: python3 tests/presets/check_presets.py

      # The theme is one palette read through one funnel, and every failure it
      # has produced on this panel was the same shape: a widget inked once in the
      # constructor with paletteFor (false) - the IVORY panel's colours - and
      # never re-inked by applyTheme(), or never inked at all, in which case a
      # juce::Slider text box, a juce::Label and a juce::ComboBox value all fall
      # back to the Look and Feel's own colour scheme, which is V4's DARK one
      # whatever panel is showing. Nothing warns and nothing fails to build; the
      # control is simply white on an ivory panel, or ivory-backed on charcoal.
      # Every one of those came from a screenshot report. So the wiring is read out of the
      # source: every widget member in the header has to be reached by
      # applyTheme(), and every Look and Feel the editor owns has to carry the
      # combo placeholder colour - the one drawn from the Look and Feel's own map
      # rather than the box's, which is why "FACTORY..." and "USER..." stayed
      # white for as long as they did.
      - name: Check the theme wiring
        run: python3 tests/theme/check_theme_wiring.py

      # The English IS the translation key (see xlat() in PluginEditor.cpp), so
      # nothing keeps a table and the tooltip it translates in step: reword the
      # sentence and its translation stays behind, and from then on that one
      # control shows English in a translated panel. No build log says so and no
      # screenshot shows it. It found seventeen entries that way when it was
      # added - the transport keys, seven page tooltips and the two saturation
      # controls of a revision the panel no longer has - all of them live in
      # Ukrainian again now.
      - name: Check the translation tables
        run: python3 tests/translations/check_translations.py

      # The parameter table and the code that reads it are two lists that drift,
      # and both directions of drift produce the same user report - "the knobs do
      # nothing". A name in the table that nothing reads is a row in the host's
      # automation list that consumes nothing; a name read that the table does not
      # hold is SILENT, because getRawParameterValue() returns nullptr rather than
      # throwing, getParameter() returns nullptr rather than throwing, and every
      # call site in the processor is written `if (x != nullptr)` - so a typo is a
      # control that is attached, automated, saved and hears nothing; and a handle
      # that is fetched and then never dereferenced is the same nothing with an
      # unfinished refactor for a cause. No build log mentions any of the three.
      - name: Check the parameter table wiring
        run: python3 tests/parameters/check_parameters.py

      # The panel's GLSL is the one piece of the UI nothing else here can see: it
      # is a string literal until a driver compiles it at run time, so a shader
      # that does not compile is a hole where the scene should be, with nothing in
      # the build log and no failure anywhere. This reads the literals and the
      # uniforms the renderer supplies. Every line of both sources has to still BE
      # one literal - a paste that leaves a bare quote behind closes the literal
      # early and swallows the rest of the line into a C++ comment, which is a
      # corruption that COMPILES - and every uniform the shader declares has to be
      # set, and vice versa, because setUniform() with a name the linked program
      # does not declare is a no-op on both sides of the mistake.
      - name: Check the shader sources
        run: python3 tests/shaders/check_shaders.py

      # The macros the build hands the compiler, against the files that read them.
      # cmake/J37VendorLibraries.cmake discovered Intel IPP, linked it, and then
      # defined J37_HAVE_IPP and J37_HAVE_VDSP for a plugin whose code tested
      # neither - so "the DSP takes its vDSP path" was a statement about the build
      # that nothing checked, and the IPP install on this runner accelerated
      # nothing at all. The switch that library's own FFT engine is gated on is
      # JUCE's, and it is not the flag named online (JUCE 9.0.4 has no
      # JUCE_DSP_USE_INTEL_IPP anywhere). This compares both lists and asserts
      # both directions of that one.
      - name: Check the compile definitions
        run: python3 tests/definitions/check_definitions.py

      # The link line, against the includes under Source/. A library on it is a
      # statement that the binary carries it; eighteen entries made that statement
      # while no file of the plugin's own code named them - four alternative FFTs
      # against the one pocketfft the spectrum analyser calls, a second decoder
      # stack, a GUI toolkit, a socket library, two rival pitch detectors, a
      # reverb and an LGPL time stretcher. This reads
      # target_link_libraries(first ...) and every #include under Source/ and
      # fails on a target with no caller, on an included library that is not
      # linked, and on a J37_HAS_* probe that nothing reads - which is how xsimd's
      # branch survived two builds without being compiled by either.
      - name: Check the link line against the code
        run: python3 tests/linkline/check_linkline.py

      # The stages that have moved into Source/DSP/ are compiled by the harnesses
      # against their own small stand-in for juce::, which is what keeps a harness
      # seconds of work - but a name that stand-in provides is not proof that real
      # JUCE provides it, and the moment a stage moves into a header of its own is
      # exactly when that stops being a safe assumption. Harness green and plugin
      # red would be a fifteen-minute discovery in the platform builds; this makes
      # it a two-second one here. What it compiles is the DIRECTORY - every *.h in
      # Source/DSP/ - so a stage that moves in is checked here on the next run
      # without being named anywhere. It reads the JUCE
      # submodule, which is what the checkout above fetches and why it does: an
      # empty JUCE/ is a setup fault, and the script says so by name.
      - name: Check the moved DSP headers against JUCE
        run: bash tests/dsp/check_headers_juce.sh

      # The editor and the processor, split into files: every translation unit that
      # compiles one of them, plus every header of the plugin's own - the top level
      # of Source/ and Source/GUI/ - on its own. The harnesses above compile
      # extracted SPANS - the knob arithmetic, the transport rig, a saved state -
      # never a whole file, so a block that moved to a new .cpp with a missing
      # include, or a header that only compiles when the editor's was included first,
      # is textually perfect and does not compile. This is the same trick as the
      # check above, one level up: real JUCE, -fsyntax-only, seconds. It reads the
      # JUCE submodule, which the checkout above fetches.
      - name: Check the plugin's own files against JUCE
        run: bash tests/editor/check_editor_juce.sh

  # ============================================================================
  #  DSP unit tests - the pieces UNDERNEATH the harnesses
  #
  #  The harness job above renders audio and asserts on the recording, which is
  #  the right tool for a signal path and the wrong one for "does this function
  #  still return what it returned yesterday". The three stages tested here - the
  #  equaliser, the conventional compressor and the transient designer - hold no
  #  engine state, take their coefficients as arguments, and carry a written
  #  contract in their own header comments, so each is driven directly instead of
  #  through a replica of the engine: a call, a number, and the claim it stands
  #  for named in the test's own title.
  #
  #  This one IS a gate, unlike the benchmark job below: the whole suite is
  #  microseconds of work with no machine-dependent number anywhere in it.
  #
  #  The framework is Catch2, which CPM fetches only under -DJ37_BUILD_TESTS=ON,
  #  so the job configures once with that flag first - which is also what
  #  populates the CPM cache that tests/unit/run.sh looks in. The script then
  #  compiles Catch2's own amalgamated sources and runs the suite twice: once
  #  plain, and once under ASan and UBSan, where a one-function numerical mistake
  #  is cheapest to see. No CMake build of the plugin, no JUCE, no audio backend:
  #  like every other harness here, it is seconds of work on any machine with a
  #  C++17 compiler.
  # ============================================================================
  dsp-unit:
    name: DSP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux audio and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure with the dev tests enabled (fetches Catch2)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJ37_BUILD_TESTS=ON

      - name: Run the DSP unit tests
        run: bash tests/unit/run.sh

      # -fno-sanitize-recover=all inside the script makes any finding fail this
      # step rather than printing and carrying on, and the binary's exit status
      # is the script's - a failed assertion cannot be filtered away.
      - name: Run the DSP unit tests under ASan and UBSan
        run: J37_SANITIZE=address,undefined bash tests/unit/run.sh

  # ============================================================================
  #  DSP micro-benchmarks - measurement, never a gate
  #
  #  Runs after the regression harness and is allowed to fail the job only if it
  #  cannot BUILD. The numbers it prints are machine-dependent, so treating a
  #  slower measurement as a build failure would make CI flaky and would push the
  #  threshold down until it meant nothing. What it is for is the record: every
  #  run logs the frame cost and the realtime headroom, so "did this change make
  #  the engine cheaper or dearer" has an answer that is not a guess.
  #
  #  It needs nanobench, which CPM fetches only under -DJ37_BUILD_TESTS=ON, so
  #  the job configures once with that flag before running the script.
  # ============================================================================
  dsp-bench:
    name: DSP micro-benchmarks (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux audio and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Configure with the dev tests enabled (fetches nanobench)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJ37_BUILD_TESTS=ON

      - name: Run the DSP micro-benchmarks
        run: bash tests/dsp/run_bench.sh

      # The other measurement, under the same contract: informational, and it
      # fails only when a model does not load or renders a non-finite sample -
      # never because a number is slow. It compiles NAM Core's sixteen Eigen
      # translation units first, which is the minute this job's timeout was
      # sized for on top of the DSP benchmark above.
      - name: .nam inference cost (NAM Core vs RTNeural)
        run: bash tests/neural/run_bench.sh

      # Informational only: record the CPU share of the naive tanh/exp hot
      # path against the same nanobench build, never a gate.
      - name: DSP hot-path probe (tanh/exp CPU share)
        run: |
          python3 - <<'PROBE'
          import math, time, sys

          N = 50_000_000
          samples = [math.sin(i * 1e-5) for i in range(N % 1000 + 1)]
          samples = samples * (N // len(samples) + 1)
          samples = samples[:N]

          def bench(label, fn, data):
              start = time.perf_counter()
              out = [fn(x) for x in data]
              elapsed = time.perf_counter() - start
              total = sum(out)
              print(f"{label}: {elapsed:.6f}s  checksum={total:.6f}")
              return elapsed

          tanh_t = bench("tanh", math.tanh, samples)
          exp_t = bench("exp", math.exp, samples)
          total_t = bench("total", lambda x: math.tanh(x) + math.exp(x), samples)

          share = (tanh_t + exp_t) / total_t if total_t else 0.0
          print(f"tanh+exp CPU share ~ {share:.2%} of tanh+exp frame cost")
          sys.exit(0)
          PROBE

  # ============================================================================
  #  Editor Debug build - Linux VST3 with the Melatonin inspector embedded
  #
  #  The inspector is compiled only under JUCE_DEBUG, so no Release
  #  configuration ever touches it and the shipped plugin carries nothing
  #  extra. This job keeps that code path honest: it configures and compiles a
  #  full Debug build (which also exercises CPM from a cold cache in a second
  #  config) and keeps the VST3 as an artifact for local debugging sessions.
  # ============================================================================
  build-linux-debug:
    name: build-linux-debug (Melatonin inspector)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux audio and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libfontconfig-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Intel IPP (PyPI wheels)
        run: |
          # Intel's oneAPI installer is a ~1.5 GB GUI installer that does not work
          # from a command line, and it is not needed: Intel publishes the same
          # library on PyPI as ipp-static plus its ipp-include dependency, both
          # maintained by Intel, and they are the only IPP distribution a GitHub
          # runner can install at all. Without this step the build would only
          # ever prove the "IPP absent" path.
          #
          # These wheels carry no CMake config package, so the prefix has to be
          # found and handed to CMake as IPPROOT. It cannot be computed: a venv,
          # a hosted-toolcache Python and a system Python each put it somewhere
          # else, and sysconfig is no help because in a venv its 'include'
          # reports the BASE interpreter's headers. So look for the header and
          # take its prefix - the libraries land in the same tree.
          #
          # The wheels are unpinned on purpose: pip resolves the current release
          # and there is no version to rot.
          #
          # The header this searches for is the aggregator - its whole body is
          # #include <ipp/ipp.h> - and the real ones, including the two JUCE's
          # own IPP FFT engine includes, sit one level down in
          # <prefix>/include/ipp. cmake/J37VendorLibraries.cmake looks there, and
          # for the single-threaded static layout this runner installs it also
          # throws the linking-model macro JUCE reads, so this job is the one
          # that compiles juce::dsp::FFT against Intel's library - which is why
          # the build's link line now has to carry ippvm with it (it was missing
          # before anything referenced IPP, and without it the link fails on
          # `y8_ippsSin_32f_A24').
          python -m pip install --upgrade pip
          python -m pip install ipp-static
          prefix=$(python - <<'PYIPP'
          import glob, os, site
          found = ""
          for base in site.getsitepackages():
              for up in range(1, 5):
                  p = os.path.normpath(os.path.join(base, *[".."] * up))
                  if glob.glob(os.path.join(p, "include", "ipp.h")):
                      found = p
                      break
              if found:
                  break
          print(found)
          PYIPP
          )
          test -n "$prefix" || { echo "could not locate the ipp-include prefix"; exit 1; }
          echo "Intel IPP prefix: $prefix"
          echo "IPPROOT=$prefix" >> "$GITHUB_ENV"

      # The one thing a Debug build proves that Release hides is what the
      # sanitizers can see, and this job is the only place a Debug toolchain is
      # already paid for. The harnesses above are seconds of work each and need
      # no toolkit, no host and no submodules, so they run here a second time
      # with ASan and UBSan turned on: the shipped DSP generator, the knob
      # strip's arithmetic, the state writer/reader, the transport rig, the
      # pitch stage's delay line, the corrector's ring buffers in BOTH of its
      # engines, and the room's feedback network - with the vendored verb.c
      # instrumented too, since that is where the tank's own delay buffers live.
      # tests/neural goes further than Source/: it compiles NAM Core's own
      # translation units WITH the sanitizers as well, so the inference engine's
      # ring buffers and Eigen arithmetic are instrumented alongside the stage
      # that drives them. Everything is executed as compiled out of Source/
      # rather than as a copy of it.
      # -fno-sanitize-recover=all makes any finding fail the step instead of
      # printing and carrying on.
      - name: Run the harnesses under ASan and UBSan
        run: |
          J37_SANITIZE=address,undefined bash tests/dsp/run.sh
          J37_SANITIZE=address,undefined bash tests/layout/run.sh
          J37_SANITIZE=address,undefined bash tests/tooltip/run.sh
          J37_SANITIZE=address,undefined bash tests/state/run.sh
          J37_SANITIZE=address,undefined bash tests/transport/run.sh
          J37_SANITIZE=address,undefined bash tests/pitch/run.sh
          J37_SANITIZE=address,undefined bash tests/phase/run.sh
          J37_SANITIZE=address,undefined bash tests/gain/run.sh
          J37_SANITIZE=address,undefined bash tests/limiter/run.sh
          J37_SANITIZE=address,undefined bash tests/mix_crossfader/run.sh
          J37_SANITIZE=address,undefined bash tests/neural/run.sh
          J37_SANITIZE=address,undefined bash tests/spectrum/run.sh
          J37_SANITIZE=address,undefined bash tests/reverb/run.sh

      - name: Configure CMake (Debug)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Compile (Debug)
        run: |
          cmake --build build --config Debug --parallel "$J37_BUILD_JOBS" 2>&1 | tail -40
          test ${PIPESTATUS[0]} -eq 0

      - name: Verify the Debug VST3 bundle was produced
        run: |
          found=$(find build/first_artefacts/Debug -name "*.vst3" | head -1)
          if [ -z "$found" ]; then
            echo "No Debug VST3 bundle was produced"
            exit 1
          fi
          echo "Debug VST3 bundle: $found"

      - name: Upload Debug VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: first-linux-debug-vst3
          path: build/first_artefacts/Debug/**/*.vst3
          if-no-files-found: error

  # ============================================================================
  #  Windows - VST3
  # ============================================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # JUCE is a submodule pinned at 9.0.4. Recursive checkout gives exactly
          # the same source that the macOS job builds, so neither platform can
          # drift onto a different JUCE revision.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Intel IPP (PyPI wheels)
        shell: pwsh
        run: |
          # Same two Intel wheels the Linux jobs use, and the reason the
          # mechanism is the same on both: the oneAPI installer is a ~1.5 GB GUI
          # installer that does not work from a command line, oneAPI is not in
          # winget (there is an open package request) and Chocolatey has
          # nothing. The win_amd64 wheel puts its libraries in Library/lib as
          # ippsmt.lib / ippcoremt.lib, which CMakeLists.txt searches for
          # explicitly.
          #
          # The prefix has to be located rather than computed, for the reasons
          # in the Linux job, and IPPROOT is what tells CMake where it is.
          python -m pip install --upgrade pip
          python -m pip install ipp-static
          # One line on purpose. A PowerShell here-string works as an argument,
          # but PowerShell mangles embedded newlines when it hands a string to a
          # native command, and this is a native command. One line, no newlines,
          # nothing to mangle.
          $prefix = python -c "import glob,os,site;print(next((os.path.normpath(os.path.join(b,*['..']*u)) for b in site.getsitepackages() for u in range(1,5) if glob.glob(os.path.join(os.path.normpath(os.path.join(b,*['..']*u)),'include','ipp.h'))),''))"
          $prefix = $prefix.Trim()
          if (-not $prefix) { throw "could not locate the ipp-include prefix" }
          Write-Host "Intel IPP prefix: $prefix"
          "IPPROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake
        shell: pwsh
        run: |
          # The generator is not named explicitly. "Visual Studio 18 2026" is the
          # name for the current VS, but that string changes with every Visual
          # Studio release and a wrong one fails the configure step outright -
          # which already happened once here. Letting CMake pick the newest
          # installed generator keeps this working across runner image updates.
          #
          # J37_FAST_WINDOWS_BUILD drops /GL + /LTCG. Those are the single largest
          # avoidable cost in a Windows build: whole-program optimisation makes MSVC
          # write and re-read an intermediate representation for every object, roughly
          # doubling the work. CI is a compile check, not a release build, so the
          # speed is worth more here than the last few percent of optimisation.
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DJ37_FAST_WINDOWS_BUILD=ON

      - name: Show which toolchain CMake selected
        shell: pwsh
        run: |
          # One line each, rather than dumping the whole cache.
          Select-String -Path build/CMakeCache.txt -Pattern '^CMAKE_GENERATOR:|^CMAKE_CXX_COMPILER:' |
              ForEach-Object { $_.Line }

      - name: Build
        shell: pwsh
        run: |
          # /MP inside the project plus MSBuild-level parallelism: without both,
          # MSBuild only parallelises across projects and this solution has few, so
          # most of the runner's cores sit idle on a build this size.
          $env:CMAKE_BUILD_PARALLEL_LEVEL = [Environment]::ProcessorCount
          $env:CL_MPCount = [Environment]::ProcessorCount

          # --parallel with no count lets MSBuild scale to the runner. Nothing is printed
          # for a translation unit that succeeds, which is what kept this log enormous:
          # a full JUCE build is hundreds of files, and every one of them was a line.
          # A failure still prints in full, which is the only part worth reading.
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2>&1 |
            ForEach-Object {
                # Drop the per-file progress chatter, keep warnings and errors.
                if ($_ -match 'cl : .*warning|error|Error|warning [A-Z]+[0-9]+') { $_ }
            }

          # The pipeline above hides the exit code, so check it explicitly.
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Build failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

      # JUCE's CMake build writes the bundles to
      #   <build>/first_artefacts/<Config>/<FORMAT>/<PRODUCT_NAME>.<ext>
      # i.e. the format is a subfolder of the config folder and the bundle is named
      # after PRODUCT_NAME, not after the CMake target. Asking for a hard-coded
      # "first.vst3" therefore fails even on a perfectly good build, so the bundle
      # is located by pattern instead. On Windows this is a proper VST3 *bundle*
      # (first.vst3/Contents/x86_64-win/first.vst3), not the flattened file the
      # retired Projucer project produced.
      - name: Verify the VST3 bundle was produced
        id: vst3
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path "build/first_artefacts/${{ env.BUILD_TYPE }}" `
                                 -Recurse -Filter "*.vst3" -Directory |
                       Sort-Object FullName |
                       Select-Object -First 1
          if ($null -eq $bundle) {
              Write-Error "No .vst3 bundle found under build/first_artefacts/${{ env.BUILD_TYPE }}"
              Get-ChildItem -Recurse build/first_artefacts -ErrorAction SilentlyContinue |
                  Select-Object -First 40 FullName
              exit 1
          }
          $binary = Get-ChildItem -Path $bundle.FullName -Recurse -Filter "*.vst3" -File |
                       Select-Object -First 1
          if ($null -eq $binary) {
              Write-Error "VST3 bundle $($bundle.FullName) contains no .vst3 binary"
              Get-ChildItem -Recurse $bundle.FullName | Select-Object FullName
              exit 1
          }
          Write-Host "Bundle:     $($bundle.FullName)"
          Write-Host "Binary:     $($binary.FullName)"
          "bundle=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "binary=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiBoX-VST3-Windows
          path: ${{ steps.vst3.outputs.bundle }}
          if-no-files-found: error

  # ============================================================================
  #  macOS - VST3 + AU + AUv3, universal (arm64 + x86_64)
  # ============================================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule missing - CMakeLists.txt adds it via add_subdirectory(JUCE)."
            echo "Run: git submodule update --init --recursive"
            exit 1
          fi
          ls JUCE/modules | head -n 5

      # The universal binary is requested through CMAKE_OSX_ARCHITECTURES so that
      # every target in the build - plugin, AU wrapper and the AUv3 app extension
      # - is built for both architectures in one pass. Passing -arch at the
      # xcodebuild level would only affect the top-level target.
      #
      # The Xcode generator is required, not merely preferred: JUCE only adds the
      # AUv3 target when the generator is Xcode (JUCEModuleSupport.cmake,
      # _juce_get_platform_plugin_kinds). With the default Unix Makefiles
      # generator the AUv3 format is silently dropped from the build, so a
      # "Build all" run produces VST3 and AU only and first.appex never appears.
      #
      # Code signing is disabled: this is a CI build with no Developer ID
      # certificate. See README "Signing and notarisation" for what a
      # distributable build needs instead.
      - name: Configure CMake
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build
        run: |
          # Quietened for the same reason as the Windows job: a universal build of a
          # full JUCE plugin is hundreds of translation units across two architectures,
          # and printing every one of them buried the actual result. Only warnings and
          # errors are kept.
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 2>&1 |
            grep -E 'error|warning|Error|FAILED|BUILD' || true

          # grep returns 1 when it matches nothing, so the pipeline status cannot be
          # trusted alone. Re-run the build's own status check instead: a no-op second
          # pass costs a second and reports the real exit code.
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel > /dev/null 2>&1 || {
            echo "Build failed - re-running with full output:"
            cmake --build build --config ${{ env.BUILD_TYPE }} --parallel
            exit 1
          }

      # Ad-hoc signing. There is no Developer ID certificate in CI (see README
      # "Signing and notarisation"), so the bundles leave the build unsigned -
      # except that an arm64 slice MUST be signed for macOS to execute it at
      # all, even ad-hoc. "--sign -" writes exactly that: a signature with no
      # identity, which carries no notarisation and no trust, but satisfies the
      # arm64 requirement and keeps a downloaded build one "xattr -cr" away from
      # loading (README, the macOS user section). --deep is deprecated for
      # signing *distributable* products but is the right tool here: it reaches
      # the nested executables (the AUv3 appex) that a parent-only signing
      # would leave unsigned. Paths: JUCE lays the AU bundle under the AU/
      # format folder - "Components" is the name of the INSTALLED folder under
      # ~/Library/Audio/Plug-Ins, not of the build tree - and the bundle name
      # ends .vst3, not .vstizer. Each bundle is located by pattern rather than
      # by name so a PRODUCT_NAME change cannot silently break the step.
      - name: Ad-hoc codesign the plugin bundles
        run: |
          set -euo pipefail
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}"

          sign() {
            local found
            found=$(find "$BASE/$1" -maxdepth 1 -name "*.$2" -print -quit 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "codesign (ad-hoc): $found"
              codesign --force --deep --sign - "$found"
            fi
          }

          sign VST3 vst3
          sign AU component
          sign AUv3 appex

      # JUCE's CMake build lays the bundles out as
      #   <build>/first_artefacts/<Config>/<FORMAT>/<PRODUCT_NAME>.<extension>
      # so the paths are Release/VST3/*.vst3, Release/AU/*.component and
      # Release/AUv3/*.appex - not first.vst3 directly inside Release/. They are
      # located by pattern so a future PRODUCT_NAME change cannot silently break
      # the check. Each located bundle is exported to $RUNNER_TEMP/bundles.txt for
      # the following steps.
      - name: Verify all three formats were produced
        run: |
          set -euo pipefail
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}"
          : > "$RUNNER_TEMP/bundles.txt"
          missing=0

          locate() {
            # $1 = format subfolder, $2 = extension
            local found
            found=$(find "$BASE/$1" -maxdepth 1 -name "*.$2" -print -quit 2>/dev/null || true)
            if [ -z "$found" ]; then
              echo "MISSING: $BASE/$1/*.$2"
              missing=1
              return 0
            fi
            echo "OK: $1 -> $found"
            echo "$found" >> "$RUNNER_TEMP/bundles.txt"
          }

          locate VST3 vst3
          locate AU component
          locate AUv3 appex

          if [ "$missing" -ne 0 ]; then
            echo "--- what was actually built ---"
            find build/first_artefacts -maxdepth 3 2>/dev/null || true
            exit 1
          fi

      - name: Verify the binaries are universal
        run: |
          set -euo pipefail

          check() {
            local bundle="$1"
            local binary
            binary=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f -print -quit)
            if [ -z "$binary" ]; then
              echo "No executable inside $bundle" >&2
              exit 1
            fi
            echo "--- $binary ---"
            lipo -info "$binary" | tee /tmp/lipo.txt
            # Both slices must be present. A single-arch build would install but
            # silently fail to load on the other half of the machines.
            grep -q "arm64" /tmp/lipo.txt
            grep -q "x86_64" /tmp/lipo.txt
          }

          while IFS= read -r bundle; do
            check "$bundle"
          done < "$RUNNER_TEMP/bundles.txt"

      # What the plugin will and will not LOAD ON.
      #
      # This is the one build setting whose failure lands entirely in the user's
      # copy of the plugin: with no deployment target, Xcode stamps every binary
      # with the version of the SDK it was built against - the runner's own macOS
      # - so a release built on a macOS 15 runner loads on macOS 15 and on nothing
      # older. The host reports the plugin as unavailable, or Logic and GarageBand
      # simply do not list it, on every machine a couple of years behind the
      # runner, and the build log is clean. The value is read out of the CMake
      # cache rather than restated here, so this checks that the setting REACHED
      # the targets: the two cannot drift, and a change to the floor in
      # CMakeLists.txt needs no change here.
      - name: Verify the deployment target of every bundle
        run: |
          set -euo pipefail

          FLOOR="$(grep -E '^CMAKE_OSX_DEPLOYMENT_TARGET:' build/CMakeCache.txt | cut -d= -f2 || true)"
          if [ -z "$FLOOR" ]; then
            echo "CMAKE_OSX_DEPLOYMENT_TARGET is not in the CMake cache, so nothing"
            echo "pinned the minimum macOS these binaries load on: every slice is"
            echo "stamped with the runner's own version and loads on that and newer only."
            exit 1
          fi
          echo "configured floor: macOS $FLOOR"

          # 11 and 11.0 and 11.0.0 are one version, so they compare as one. The
          # fourth variable is what keeps a trailing ".0" out of the patch field:
          # read() gives the LAST name the rest of the line, dots and all.
          rank() {
            local major minor patch rest
            IFS=. read -r major minor patch rest <<< "$1.0.0"
            printf '%d%03d%03d' "$major" "$minor" "$patch"
          }

          minos_of() {
            # $1 = binary, $2 = architecture. vtool is the direct answer and lives
            # in the Xcode toolchain; otool -l is everywhere and prints the same
            # field, so a runner without the former still checks the same fact.
            if command -v vtool > /dev/null 2>&1; then
              vtool -arch "$2" -show-build "$1" | awk '/minos/ { print $2; exit }'
              return
            fi
            otool -arch "$2" -l "$1" | awk '/minos/ { print $2; exit }'
          }

          while IFS= read -r bundle; do
            binary=$(find "$bundle/Contents/MacOS" -maxdepth 1 -type f -print -quit)
            if [ -z "$binary" ]; then
              echo "No executable inside $bundle" >&2
              exit 1
            fi
            echo "--- $bundle"

            for arch in arm64 x86_64; do
              MINOS="$(minos_of "$binary" "$arch")"
              if [ -z "$MINOS" ]; then
                echo "$binary has no $arch slice to read a minimum version from" >&2
                exit 1
              fi
              echo "    $arch : minos $MINOS"
              if [ "$(rank "$MINOS")" -ne "$(rank "$FLOOR")" ]; then
                echo "$binary's $arch slice is stamped for macOS $MINOS, not the" >&2
                echo "configured $FLOOR: the deployment target did not reach this target," >&2
                echo "so the bundle refuses to load on the machines the floor promises." >&2
                exit 1
              fi
            done

            # Informational: CMake puts the same number in the plist when the
            # template has the key at all, and a plist that disagrees with the
            # binary is worth seeing in the log even though the loader reads the
            # binary.
            echo "    plist LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist" 2>/dev/null || echo '(absent)')"
          done < "$RUNNER_TEMP/bundles.txt"

      # The signature, verified rather than written. The step above signs the
      # bundles ad-hoc so the arm64 slices execute at all (a Mac refuses to run
      # arm64 code with no signature); a bundle whose signature does not VERIFY -
      # a nested executable the parent-only signing missed, a plist edited after
      # signing, a file copied into the bundle afterwards - is one a host is
      # entitled to refuse to load, and the refusal reads as "the plugin does not
      # work" with nothing on screen to say why. --strict is what makes this more
      # than a presence test, and --deep reaches the appex inside AUv3.
      - name: Verify each bundle's signature
        run: |
          set -euo pipefail

          while IFS= read -r bundle; do
            echo "--- $bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            # `codesign -dv` writes to stderr on a bundle with no identity, which
            # is exactly the case here, so both streams are kept.
            codesign -dv "$bundle" 2>&1 | sed -n '1,4p'
          done < "$RUNNER_TEMP/bundles.txt"

      # The AU, actually LOADED.
      #
      # Everything above this line is a statement about files. This is the first
      # step in the whole workflow that RUNS the macOS plugin: auval is Apple's own
      # Audio Unit host, and it instantiates the component, walks the parameter
      # tree, exercises the state and renders audio through it. That is the closest
      # thing to "does the plugin work on a Mac" a machine with no DAW and no
      # console can ask - and until this step existed, nothing in CI had ever
      # loaded the macOS binary it had just built. The component is installed where
      # a host looks for one, because that is the only way auval sees it: it
      # validates registered components, not a path.
      #
      # What a failure here means: the AU does not instantiate, or its parameters
      # or its rendering do not satisfy the AU contract, so Logic and GarageBand
      # will not host it either. The identity it is validated under is read from
      # the BUILT plist - not restated from the codes in CMakeLists.txt - so the
      # check also covers the plist a host reads to find the component.
      - name: Validate the Audio Unit (auval)
        run: |
          set -euo pipefail

          AU="$(grep -E '\.component$' "$RUNNER_TEMP/bundles.txt" | head -n 1)"
          if [ -z "$AU" ]; then
            echo "no .component bundle was found by the format check above" >&2
            exit 1
          fi

          PLIST="$AU/Contents/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null; }

          TYPE="$(pb AudioComponents:0:type)"
          SUBTYPE="$(pb AudioComponents:0:subtype)"
          MANU="$(pb AudioComponents:0:manufacturer)"
          if [ -z "$TYPE" ] || [ -z "$SUBTYPE" ] || [ -z "$MANU" ]; then
            echo "$PLIST has no AudioComponents entry with a type, a subtype and a" >&2
            echo "manufacturer: a host discovers the component through that entry." >&2
            exit 1
          fi
          echo "AU identity, read from the built plist: $TYPE / $SUBTYPE / $MANU"

          COMPONENTS="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$COMPONENTS"
          rm -rf "$COMPONENTS"/*.component
          cp -R "$AU" "$COMPONENTS/"

          # The component registry caches what it found when the session started;
          # a component copied in afterwards is invisible until it is made to look
          # again. killall is reported as failure when no registrar is running,
          # which is not a fault.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3

          echo "--- what auval can see"
          auval -a 2>&1 | sed -n '1,20p'

          # auval has no timeout of its own, and a plugin that deadlocks inside
          # its own validation would otherwise hold a macOS runner until the job's
          # six-hour limit. The watchdog is what turns a hang into a failure with a
          # line in the log.
          echo "--- auval -v $TYPE $SUBTYPE $MANU"
          auval -v "$TYPE" "$SUBTYPE" "$MANU" &
          AU_PID=$!
          # The watchdog's own streams are closed: a background process holding
          # the step's output open is how a CI step waits out a timer nobody is
          # reading.
          ( sleep 300; kill -9 "$AU_PID" 2>/dev/null ) > /dev/null 2>&1 &
          WATCHDOG=$!

          STATUS=0
          wait "$AU_PID" || STATUS=$?
          kill "$WATCHDOG" 2>/dev/null || true
          wait "$WATCHDOG" 2>/dev/null || true

          if [ "$STATUS" -ne 0 ]; then
            echo "auval did not validate the Audio Unit (exit $STATUS)" >&2
            exit 1
          fi
          echo "auval: the Audio Unit passed validation"

      # AU and AUv3 are what Logic, GarageBand and Final Cut can actually load -
      # those hosts do not see VST3 at all.
      - name: Package artifacts
        run: |
          set -euo pipefail
          ART="$RUNNER_TEMP/artifacts"
          mkdir -p "$ART"

          while IFS= read -r bundle; do
            cp -R "$bundle" "$ART/"
          done < "$RUNNER_TEMP/bundles.txt"

          ls -la "$ART"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MiBoX-macOS
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error

  # ============================================================================
  #  Linux - VST3
  # ============================================================================
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule missing - CMakeLists.txt adds it via add_subdirectory(JUCE)."
            echo "Run: git submodule update --init --recursive"
            exit 1
          fi

      - name: Install Linux audio and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libfontconfig-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Intel IPP (PyPI wheels)
        run: |
          # Intel's oneAPI installer is a ~1.5 GB GUI installer that does not work
          # from a command line, and it is not needed: Intel publishes the same
          # library on PyPI as ipp-static plus its ipp-include dependency, both
          # maintained by Intel, and they are the only IPP distribution a GitHub
          # runner can install at all. Without this step the build would only
          # ever prove the "IPP absent" path.
          #
          # These wheels carry no CMake config package, so the prefix has to be
          # found and handed to CMake as IPPROOT. It cannot be computed: a venv,
          # a hosted-toolcache Python and a system Python each put it somewhere
          # else, and sysconfig is no help because in a venv its 'include'
          # reports the BASE interpreter's headers. So look for the header and
          # take its prefix - the libraries land in the same tree.
          #
          # The wheels are unpinned on purpose: pip resolves the current release
          # and there is no version to rot.
          #
          # The header this searches for is the aggregator - its whole body is
          # #include <ipp/ipp.h> - and the real ones, including the two JUCE's
          # own IPP FFT engine includes, sit one level down in
          # <prefix>/include/ipp. cmake/J37VendorLibraries.cmake looks there, and
          # for the single-threaded static layout this runner installs it also
          # throws the linking-model macro JUCE reads, so this job is the one
          # that compiles juce::dsp::FFT against Intel's library - which is why
          # the build's link line now has to carry ippvm with it (it was missing
          # before anything referenced IPP, and without it the link fails on
          # `y8_ippsSin_32f_A24').
          python -m pip install --upgrade pip
          python -m pip install ipp-static
          prefix=$(python - <<'PYIPP'
          import glob, os, site
          found = ""
          for base in site.getsitepackages():
              for up in range(1, 5):
                  p = os.path.normpath(os.path.join(base, *[".."] * up))
                  if glob.glob(os.path.join(p, "include", "ipp.h")):
                      found = p
                      break
              if found:
                  break
          print(found)
          PYIPP
          )
          test -n "$prefix" || { echo "could not locate the ipp-include prefix"; exit 1; }
          echo "Intel IPP prefix: $prefix"
          echo "IPPROOT=$prefix" >> "$GITHUB_ENV"

      - name: Set up and verify CMake 4.x
        run: |
          python -m pip install --user --upgrade "cmake>=4,<5"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          cmake --version
          cmake_version=$(cmake --version | sed -n '1s/^cmake version //p')
          case "$cmake_version" in
            4.*) ;;
            *)
              echo "Expected CMake 4.x, got: $cmake_version" >&2
              exit 1
              ;;
          esac

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      # --parallel "$J37_BUILD_JOBS" rather than a bare --parallel: see the note
      # on J37_BUILD_JOBS at the top of this file. This is the job the OOM killer
      # actually showed up in, and the retry below is no help against it - a build
      # that ran out of memory once runs out of memory again, three times over.
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel "$J37_BUILD_JOBS" 2>&1 |
            grep -E 'error|warning|Error|FAILED|BUILD' || true

          # Second pass to verify actual exit code
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel "$J37_BUILD_JOBS" > /dev/null 2>&1 || {
            echo "Build failed - re-running with full output:"
            cmake --build build --config ${{ env.BUILD_TYPE }} --parallel "$J37_BUILD_JOBS"
            exit 1
          }

      - name: Verify VST3 bundle was produced
        id: vst3
        run: |
          set -euo pipefail
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}/VST3"
          bundle=$(find "$BASE" -maxdepth 1 -name "*.vst3" -print -quit 2>/dev/null || true)
          if [ -z "$bundle" ]; then
            echo "No .vst3 bundle found under $BASE"
            find build/first_artefacts -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          echo "Found bundle: $bundle"
          binary=$(find "$bundle" -name "*.so" -print -quit 2>/dev/null || true)
          if [ -z "$binary" ]; then
            echo "No .so binary found inside $bundle"
            find "$bundle" || true
            exit 1
          fi
          echo "Found binary: $binary"
          file "$binary"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload Linux VST3 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MiBoX-VST3-Linux
          path: ${{ steps.vst3.outputs.bundle }}
          if-no-files-found: error

  # ============================================================================
  #  Android - Standalone (the only format JUCE's CMake layer produces there)
  #
  #  JUCE's CMake plugin-kind list reduces to Standalone when CMAKE_SYSTEM_NAME
  #  is Android, and there is no Gradle exporter in the CMake layer - so this
  #  job proves the whole codebase (plugin DSP, editor, and the six recently
  #  added third-party libraries) compiles for the NDK. The APK packaging is a
  #  separate step for a machine with the full SDK; see README, the Android
  #  section.
  # ============================================================================
  build-android:
    name: build-android (Standalone, arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule missing - CMakeLists.txt adds it via add_subdirectory(JUCE)."
            echo "Run: git submodule update --init --recursive"
            exit 1
          fi
          ls JUCE/modules | head -n 5

      - name: Install Linux build dependencies
        run: |
          # The compiler the NDK toolchain file needs on the host is only the
          # cross driver, but the JUCE configure still probes for the Linux GUI
          # pkg-config packages. Installing them keeps configure from diverging
          # between this job and build-linux. The NDK itself comes from the
          # preinstalled ANDROID_NDK_LATEST_HOME on the runner.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Select the Android NDK
        run: |
          # The ubuntu runners ship several NDKs under $ANDROID_SDK_ROOT/ndk/ and
          # ANDROID_NDK_LATEST_HOME points at the newest. The NDK bundles its
          # own Clang, so nothing else is needed to cross-compile.
          #
          # Deliberately NOT the newest, though. NDK 30 changed the AAudio C
          # headers so its enum types are no longer plain int32_t, and JUCE's
          # vendored Oboe static_asserts on the old shape - the whole Android
          # build then dies inside JUCE with "AAudio_DeviceType must be
          # int32_t", which is nothing this repository can fix and nothing it
          # should keep re-discovering. The newest NDK BELOW 30 is the pin; if a
          # runner ever has none this says so loudly instead of silently
          # reverting to the newest one.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          selected=""
          for dir in "$sdk_root"/ndk/*; do
            [ -d "$dir" ] || continue
            major="$(basename "$dir" | cut -d. -f1)"
            case "$major" in
              ''|*[!0-9]*) continue ;;
            esac
            [ "$major" -lt 30 ] || continue
            if [ -z "$selected" ] || [ "$dir" \> "$selected" ]; then
              selected="$dir"
            fi
          done
          if [ -z "$selected" ]; then
            selected="$ANDROID_NDK_LATEST_HOME"
            echo "::warning::No Android NDK below 30 on this runner - falling back to $selected, which JUCE's bundled Oboe may refuse to compile against."
          fi
          echo "NDK: $selected"
          ls "$selected" | head -n 5
          echo "J37_ANDROID_NDK=$selected" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Intel IPP (PyPI wheels)
        run: |
          # Same mechanism as the Linux job (see its step for the full story):
          # Intel's static IPP from PyPI, the prefix located by finding ipp.h
          # and exported as IPPROOT. In this cross-build the probe is harmless:
          # the wheel libraries are x86 archives, an ARM link line names no IPP
          # target, and J37_HAVE_IPP / J37_IPP_LINKING_MODEL therefore stay
          # unset.
          python -m pip install --upgrade pip
          python -m pip install ipp-static
          prefix=$(python - <<'PYIPP'
          import glob, os, site
          found = ""
          for base in site.getsitepackages():
              for up in range(1, 5):
                  p = os.path.normpath(os.path.join(base, *[".."] * up))
                  if glob.glob(os.path.join(p, "include", "ipp.h")):
                      found = p
                      break
              if found:
                  break
          print(found)
          PYIPP
          )
          test -n "$prefix" || { echo "could not locate the ipp-include prefix"; exit 1; }
          echo "Intel IPP prefix: $prefix"
          echo "IPPROOT=$prefix" >> "$GITHUB_ENV"

      - name: Configure CMake (Android Cross-Build)
        run: |
          # API 28, not 24: chowdsp_core's aligned allocator (a hard dependency
          # of this build) calls std::aligned_alloc, and bionic has had it only
          # since API 28 - compiling against 24 produced "reference to
          # unresolved using declaration" deep inside chowdsp headers.
          #
          # Two spellings, both required, and the second is a CMAKE variable
          # rather than an environment one: CMAKE_ANDROID_NDK drives the
          # toolchain, while ANDROID_NDK is read with ${ANDROID_NDK} by JUCE's
          # module layer when it adds the NDK's bundled cpu-features.c to
          # juce_core (JUCEModuleSupport.cmake reads the CMake variable, so an
          # environment prefix does nothing - it must be -D). Without it
          # configure dies with "Cannot find source file:
          # /sources/android/cpufeatures/cpu-features.c" - an empty root
          # spliced into the path.
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_API=29 \
            -DCMAKE_ANDROID_NDK="$J37_ANDROID_NDK" \
            -DANDROID_NDK="$J37_ANDROID_NDK" \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a

      - name: Build
        run: |
          set -o pipefail
          cmake --build build-android --config ${{ env.BUILD_TYPE }} --parallel 2>&1 |
            grep -E 'error|warning|Error|FAILED|BUILD' || true

          cmake --build build-android --config ${{ env.BUILD_TYPE }} --parallel > /dev/null 2>&1 || {
            echo "Build failed - re-running with full output:"
            cmake --build build-android --config ${{ env.BUILD_TYPE }} --parallel
            exit 1
          }

      # APKs can only be assembled by a build machine with the Android SDK,
      # so this is a dedicated packaging step. The CI Android job intentionally
      # produces the JUCE Standalone .so only; the full APK (manifest, activity,
      # resources, signing) belongs to the Gradle project that consumes the
      # generated native libraries. This step wires Gradle up to the workflow so
      # Android ships a downloadable APK artifact whenever that Gradle project
      # is present; until then it reports and skips cleanly.
      - name: Package Android APK artifact
        id: apk
        run: |
          set -euo pipefail

          # The APK needs a Gradle project (manifest, activity, resources,
          # signing) that consumes the Standalone .so built above; this
          # repository does not carry one, so packaging is skipped until it
          # does, and the job still verifies the .so below.
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ] && [ ! -d app ]; then
            echo "No Android Gradle project found (settings.gradle[.kts] / app/) -"
            echo "skipping APK packaging; the Standalone .so is still verified below."
            echo "apk_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "apk_ready=true" >> "$GITHUB_OUTPUT"

          # Gradle is expected under $HOME/android-sdk/cmdline-tools/latest/bin.
          # Install commandlinetools into the same location as the SDK and run
          # the project's assembleRelease task here, exactly as a contributor
          # would on a machine with the full SDK.
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Installing Android SDK commandlinetools..."
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools" "$RUNNER_TEMP/android-cmdline-tools"
            curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            # The zip unpacks to its own cmdline-tools/ directory, but the SDK
            # layout wants it under cmdline-tools/latest/. Unpack into a
            # staging directory first: mv would otherwise move the directory
            # inside itself, which it refuses even when the target name does
            # not exist yet.
            unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            rm -rf "$RUNNER_TEMP/android-cmdline-tools" "$RUNNER_TEMP/cmdline-tools.zip"
          fi

          sdkmanager --licenses < /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # Bootstrap the Gradle wrapper so a fresh runner without a checked-in
          # wrapper can execute assembleRelease.
          if [ ! -f gradlew ]; then
            wget -q https://services.gradle.org/distributions/gradle-9.8.2-bin.zip
            unzip -q gradle-9.8.2-bin.zip
            ./gradle-9.8.2/bin/gradle wrapper --gradle-version 9.8.2
            rm -rf gradle-9.8.2 gradle-9.8.2-bin.zip
          fi

          ./gradlew :app:assembleRelease --no-daemon

          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "MISSING: app/build/outputs/apk/release/app-release.apk"
            find app/build/outputs -maxdepth 3 -type f | head -40
            exit 1
          fi

          ART="$RUNNER_TEMP/android-artifacts"
          mkdir -p "$ART"
          cp app/build/outputs/apk/release/app-release.apk "$ART/"
          ls -la "$ART"

      - name: Upload Android APK Artifact
        if: steps.apk.outputs.apk_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MiBoX-Android
          path: ${{ runner.temp }}/android-artifacts
          if-no-files-found: error

      - name: Verify the Android Standalone library was produced
        run: |
          set -euo pipefail
          so=$(find build-android -name "*.so" -print -quit)
          if [ -z "$so" ]; then
            echo "MISSING: no .so produced - the Standalone target did not build"
            find build-android -maxdepth 4 -type f | head -40
            exit 1
          fi
          echo "OK: $so"
          file "$so"
          # It must be an arm64 ELF - the cross-compilation actually happened.
          file "$so" | grep -q "aarch64" || {
            echo "The produced library is not aarch64"; exit 1;
          }
