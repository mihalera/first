name: Build JUCE Plugin (VST3 + AUv3)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # JUCE is a submodule pinned at 9.0.2. Recursive checkout gives exactly the
          # same source that the macOS job builds, so neither platform can drift onto a
          # different JUCE revision.
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache objects
        uses: actions/cache@v4
        with:
          path: Builds/VisualStudio2026/x64
          # The key includes the PCH header and the project files. A stale object
          # or leftover .pch from an earlier precompiled-header layout would
          # otherwise survive into the next build and hide (or fake) a failure.
          key: msvc-build-${{ runner.os }}-${{ hashFiles('Source/**', 'Builds/VisualStudio2026/*.vcxproj', 'Builds/VisualStudio2026/pch.h', 'Builds/VisualStudio2026/pch.cpp') }}
          restore-keys: |
            msvc-build-${{ runner.os }}-

      - name: Compile VST3
        shell: powershell
        run: |
          $solution = "Builds\VisualStudio2026\first.sln"

          if (!(Test-Path $solution)) {
              Write-Error "Solution not found: $solution"
              exit 1
          }

          # CL_MPCount is set to the runner's logical processor count so MSVC
          # scales to the machine instead of a hard-coded four processes.
          $env:CL_MPCount = [Environment]::ProcessorCount

          msbuild $solution `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:BuildInParallel=true `
            /p:UseMultiToolTask=true `
            /verbosity:minimal

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J37-TapeSaturator-VST3-Windows
          path: Builds/VisualStudio2026/x64/Release/VST3/first.vst3
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -d "JUCE/modules" ]; then
            echo "JUCE submodule missing - the Xcode project resolves modules relative to the repo root."
            exit 1
          fi
          ls JUCE/modules | head -n 5

      - name: Build VST3, AU and AUv3 (universal)
        run: |
          xcodebuild \
            -project Builds/MacOSX/first.xcodeproj \
            -configuration Release \
            -arch arm64 -arch x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # The three plugin formats land in different places, so each is packaged on its
      # own. AU and AUv3 are what Logic, GarageBand and Final Cut can actually load -
      # those hosts do not see VST3 at all.
      - name: Package artifacts
        run: |
          set -e
          ART="$RUNNER_TEMP/artifacts"
          mkdir -p "$ART"

          for fmt in VST3 AU AUv3; do
            if [ -d "Builds/MacOSX/build/Release/$fmt" ]; then
              cp -R "Builds/MacOSX/build/Release/$fmt" "$ART/"
            fi
          done

          # xcodebuild puts the products under a DerivedData-style folder in some
          # configurations, so fall back to a recursive find before giving up.
          if [ -z "$(ls -A "$ART" 2>/dev/null)" ]; then
            find Builds/MacOSX -maxdepth 4 -type d \( -name '*.vst3' -o -name '*.component' -o -name '*.appex' \) -exec cp -R {} "$ART/" \;
          fi

          ls -la "$ART"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: J37-TapeSaturator-macOS
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
