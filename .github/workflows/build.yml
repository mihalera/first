name: Build JUCE Plugin (CMake)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # ============================================================================
  #  Windows - VST3
  # ============================================================================
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # JUCE is a submodule pinned at 9.0.2. Recursive checkout gives exactly
          # the same source that the macOS job builds, so neither platform can
          # drift onto a different JUCE revision.
          submodules: recursive

      - name: Configure CMake
        shell: pwsh
        run: |
          # The generator is not named explicitly. "Visual Studio 18 2026" is the
          # name for the current VS, but that string changes with every Visual
          # Studio release and a wrong one fails the configure step outright -
          # which already happened once here. Letting CMake pick the newest
          # installed generator keeps this working across runner image updates.
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Show which toolchain CMake selected
        shell: pwsh
        run: |
          Get-Content build/CMakeCache.txt | Select-String -Pattern "CMAKE_GENERATOR:|CMAKE_CXX_COMPILER:"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # CMake writes artefacts to <build>/first_artefacts/<Config>/. On Windows
      # this is a proper VST3 *bundle* - first.vst3/Contents/x86_64-win/first.vst3 -
      # not the flattened file the Projucer produced, so the old flatten-vst3.cmd
      # step is gone along with it.
      - name: Verify the VST3 bundle was produced
        shell: pwsh
        run: |
          $bundle = "build/first_artefacts/${{ env.BUILD_TYPE }}/first.vst3"
          if (!(Test-Path $bundle)) {
              Write-Error "Expected VST3 bundle not found: $bundle"
              Get-ChildItem -Recurse build/first_artefacts -ErrorAction SilentlyContinue |
                  Select-Object -First 40 FullName
              exit 1
          }
          Write-Host "Bundle contents:"
          Get-ChildItem -Recurse $bundle | Select-Object FullName

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J37-TapeSaturator-VST3-Windows
          path: build/first_artefacts/${{ env.BUILD_TYPE }}/first.vst3
          if-no-files-found: error

  # ============================================================================
  #  macOS - VST3 + AU + AUv3, universal (arm64 + x86_64)
  # ============================================================================
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify JUCE submodule is present
        run: |
          if [ ! -f "JUCE/CMakeLists.txt" ]; then
            echo "JUCE submodule missing - CMakeLists.txt adds it via add_subdirectory(JUCE)."
            echo "Run: git submodule update --init --recursive"
            exit 1
          fi
          ls JUCE/modules | head -n 5

      # The universal binary is requested through CMAKE_OSX_ARCHITECTURES so that
      # every target in the build - plugin, AU wrapper and the AUv3 app extension
      # - is built for both architectures in one pass. Passing -arch at the
      # xcodebuild level would only affect the top-level target.
      #
      # Code signing is disabled: this is a CI build with no Developer ID
      # certificate. See README "Signing and notarisation" for what a
      # distributable build needs instead.
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Verify all three formats were produced
        run: |
          set -e
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}"
          missing=0

          for artefact in first.vst3 first.component first.appex; do
            if [ ! -e "$BASE/$artefact" ]; then
              echo "MISSING: $BASE/$artefact"
              missing=1
            else
              echo "OK: $artefact"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "--- what was actually built ---"
            find build/first_artefacts -maxdepth 2 2>/dev/null || true
            exit 1
          fi

      - name: Verify the binaries are universal
        run: |
          set -e
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}"

          check() {
            local binary="$1"
            echo "--- $binary ---"
            lipo -info "$binary" | tee /tmp/lipo.txt
            # Both slices must be present. A single-arch build would install but
            # silently fail to load on the other half of the machines.
            grep -q "arm64" /tmp/lipo.txt
            grep -q "x86_64" /tmp/lipo.txt
          }

          check "$BASE/first.vst3/Contents/MacOS/first"
          check "$BASE/first.component/Contents/MacOS/first"
          check "$BASE/first.appex/Contents/MacOS/first"

      # AU and AUv3 are what Logic, GarageBand and Final Cut can actually load -
      # those hosts do not see VST3 at all.
      - name: Package artifacts
        run: |
          set -e
          ART="$RUNNER_TEMP/artifacts"
          BASE="build/first_artefacts/${{ env.BUILD_TYPE }}"
          mkdir -p "$ART"

          for artefact in first.vst3 first.component first.appex; do
            if [ -e "$BASE/$artefact" ]; then
              cp -R "$BASE/$artefact" "$ART/"
            fi
          done

          ls -la "$ART"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: J37-TapeSaturator-macOS
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
