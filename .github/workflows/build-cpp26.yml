name: Build C++26 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  J37_BUILD_JOBS: 2

jobs:
  build-cpp26:
    name: build-cpp26
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM/Clang 21, CMake 4 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget gnupg software-properties-common \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libfontconfig1-dev libcurl4-openssl-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main'
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21
          python -m pip install --upgrade cmake

      - name: Configure CMake (C++26)
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          cmake -S . -B build-cpp26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=26 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF

      - name: Build (C++26)
        run: |
          cmake --build build-cpp26 --config Release --parallel "$J37_BUILD_JOBS"
