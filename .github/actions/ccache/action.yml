name: Put a compiler launcher in front of the compiler
description: >
  Installs ccache when the runner image does not carry it, bounds its size, keeps
  its directory between runs and exports ONE launcher path for the job to pass as
  CMAKE_<LANG>_COMPILER_LAUNCHER (or to wrap the harness compiler with).

  Nothing here is required for a correct build. A runner without the package, a
  cache service having a bad day, or an evicted cache all leave the job building
  exactly what it built before this action existed - just without the saving.

inputs:
  flavour:
    description: A short name that separates one job's cache from another's.
    required: true

outputs:
  launcher:
    description: >
      Absolute path of the launcher to hand to CMake. It always exists: with
      ccache it runs ccache, without it, it execs its arguments unchanged.
    value: ${{ steps.prepare.outputs.launcher }}

runs:
  using: composite
  steps:
    - name: Prepare the compiler launcher
      id: prepare
      shell: bash
      run: |
        #  ccache is NOT on every runner image (ubuntu-26.04 does not ship it),
        #  and a job that passes `ccache` on the CMake command line then dies at
        #  the first compile with "ccache: command not found" - exit 127, three
        #  minutes into a build that was otherwise fine. So it is installed when
        #  it can be, and when it cannot the launcher below still exists and
        #  simply execs the compiler. Uncached, never broken.
        if ! command -v ccache >/dev/null 2>&1; then
          (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache) \
            >/dev/null 2>&1 || true
        fi

        bindir="$RUNNER_TEMP/j37-launcher"
        mkdir -p "$bindir"

        if command -v ccache >/dev/null 2>&1; then
          ccache --version | head -n 1

          #  ccache 4.x writes to $XDG_CACHE_HOME/ccache - ~/.cache/ccache - not
          #  to the ~/.ccache of ccache 3.x. Caching the wrong directory saves
          #  nothing and restores nothing, which is exactly what the first run
          #  did: "Cache not found for input keys: ccache-Linux-...". So the
          #  directory is named here and both the save path below and ccache
          #  itself use it.
          export CCACHE_DIR="$HOME/.ccache"
          ccache --max-size=1G

          #  Without BASEDIR the absolute checkout path is part of every hash,
          #  and without COMPILERCHECK=content a restored toolchain with a new
          #  mtime invalidates everything. Both would mean a permanent miss that
          #  looks like a working cache.
          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime,include_file_ctime"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"

          printf '#!/bin/sh\nexec %s "$@"\n' "$(command -v ccache)" > "$bindir/launcher"
        else
          printf '#!/bin/sh\nexec "$@"\n' > "$bindir/launcher"
          echo "::warning::ccache is unavailable on this runner - the launcher passes every call straight to the compiler, so this run is uncached but correct."
        fi

        chmod +x "$bindir/launcher"
        echo "J37_COMPILER_LAUNCHER=$bindir/launcher" >> "$GITHUB_ENV"
        echo "launcher=$bindir/launcher" >> "$GITHUB_OUTPUT"

    #  Keyed on the commit and restored from the newest entry of its flavour: a
    #  commit always writes its own (so a re-run never inherits a half-written
    #  one) and always starts from the most recent objects, which is where nearly
    #  all of the hit rate is - JUCE's modules and NAM Core's Eigen translation
    #  units do not change between commits.
    #
    #  continue-on-error: a cache is an optimisation. If the service is down or
    #  the entry has been evicted, the build must still run.
    - name: Restore ccache
      id: cache
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        #  The double dash matters: with a single one, the plain `linux`
        #  flavour's restore prefix `ccache-Linux-linux-` also matched
        #  `ccache-Linux-linux-debug-...`, so build-linux restored the debug
        #  job's objects, hit nothing and reported the hit rate of a cold build.
        key: ccache-${{ runner.os }}-${{ inputs.flavour }}--${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.flavour }}--

    #  Counters start at zero for this run so that the numbers reported after the
    #  build (./.github/actions/ccache-report) are this job's own hits and misses,
    #  not the previous job's totals restored with the directory.
    - name: Start counting compiler cache events
      shell: bash
      run: ccache --zero-stats 2>/dev/null || echo "ccache is not in use on this runner"
